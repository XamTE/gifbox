name: build

# main 에 올릴 때마다 빌드해서 확인하고,
# v1.0.0 처럼 태그를 밀면 릴리스에 exe 를 붙입니다.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # 릴리스 생성에 필요

env:
  PYTHONUTF8: "1"          # 러너 콘솔이 cp1252 라 한글 출력이 깨진다
  PYTHONIOENCODING: "utf-8" 

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 버전과 태그가 맞는지
        # 태그는 v1.2.0 인데 코드가 1.0.0 이면, 프로그램이 자기 버전을 잘못 알아
        # 업데이트 확인이 영원히 "새 버전 있음" 이라고 뜬다. 미리 막는다.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $code = python -c "import gifbox; print(gifbox.__version__)"
          $tag = "$env:GITHUB_REF_NAME".TrimStart("v")
          Write-Host "코드 $code · 태그 $tag"
          if ($code -ne $tag) {
            throw "gifbox.__version__ ($code) 와 태그 ($tag) 가 다릅니다"
          }

      - name: 패치노트에 이 버전이 적혀 있는지
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $body = python -c "from gifbox import changelog; print(changelog.for_version())"
          if (-not $body.Trim()) { throw "CHANGELOG.md 에 이 버전 항목이 없습니다" }
          Write-Host "패치노트 확인됨"

      # --- 가벼운 쪽: ffmpeg 없이 (PC에 설치된 ffmpeg 를 씀) ---------------
      - name: 빌드 (슬림)
        run: python build_exe.py

      - name: 자가진단 (슬림)
        # windowed(GUI) exe 라 그냥 부르면 셸이 종료를 기다리지 않는다.
        # ffmpeg·tkdnd·ImageTk 가 번들에서 빠지면 종료코드로 알려온다.
        run: |
          $p = Start-Process .\dist\GifBox.exe -ArgumentList "--selftest","report-slim.json" -PassThru -Wait
          if (Test-Path report-slim.json) { Get-Content report-slim.json }
          if ($p.ExitCode -ne 0) { throw "자가진단 실패 (종료코드 $($p.ExitCode))" }

      - name: 이름 바꿔 보관
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item dist\GifBox.exe out\GifBox.exe

      # --- 무거운 쪽: ffmpeg 를 넣어 아무 PC에서나 바로 실행 ---------------
      - name: ffmpeg 내려받기
        # 남의 서버 사정으로 빌드가 깨지지 않도록 재시도 + 대체 소스를 둔다.
        # 1순위는 GitHub 릴리스(러너와 같은 인프라라 안정적)의 LGPL 빌드.
        # LGPL 로도 우리가 쓰는 h264/webp 디코딩과 gif 인코딩은 전부 된다.
        run: |
          $sources = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $got = $false
          foreach ($url in $sources) {
            foreach ($try in 1..3) {
              try {
                Write-Host "내려받는 중 (시도 $try): $url"
                Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing -TimeoutSec 600
                $got = $true
                break
              } catch {
                Write-Host "  실패: $($_.Exception.Message)"
                Start-Sleep -Seconds (10 * $try)
              }
            }
            if ($got) { break }
          }
          if (-not $got) { throw "ffmpeg 를 어느 소스에서도 내려받지 못했습니다" }

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl -Force
          $exe = Get-ChildItem ffmpeg_dl -Recurse -Filter ffmpeg.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "내려받은 압축에 ffmpeg.exe 가 없습니다" }
          Copy-Item $exe.FullName ffmpeg.exe
          .\ffmpeg.exe -version | Select-Object -First 1

      - name: ffmpeg 코덱 확인
        # 빌드마다 코덱 구성이 다르다. webp 를 못 읽는 ffmpeg 가 섞여 들어가면
        # exe 는 멀쩡히 만들어지고 사용자가 webp 를 넣는 순간에야 깨진다.
        run: |
          $dec = (.\ffmpeg.exe -hide_banner -decoders 2>&1) -join "`n"
          foreach ($codec in @("webp_anim", "h264", "gif")) {
            if ($dec -notmatch "\s$codec\s") { throw "$codec 디코더가 없습니다" }
          }
          $enc = (.\ffmpeg.exe -hide_banner -encoders 2>&1) -join "`n"
          if ($enc -notmatch "\sgif\s") { throw "gif 인코더가 없습니다" }
          Write-Host "코덱 확인 완료: webp_anim / h264 / gif"

      - name: 빌드 (ffmpeg 포함)
        run: python build_exe.py --with-ffmpeg

      - name: 자가진단 (ffmpeg 포함)
        # 저장소 루트에 내려받은 ffmpeg.exe 가 있으면 그걸 잡아버려서
        # '번들 안의 ffmpeg' 검증이 되지 않는다. 다른 폴더에서 실행시킨다.
        run: |
          $exe = (Resolve-Path .\dist\GifBox.exe).Path
          $rep = Join-Path $env:RUNNER_TEMP "report-full.json"
          $p = Start-Process $exe -ArgumentList "--selftest",$rep -PassThru -Wait `
               -WorkingDirectory $env:RUNNER_TEMP
          if (-not (Test-Path $rep)) { throw "보고서가 생성되지 않았습니다" }
          Get-Content $rep
          if ($p.ExitCode -ne 0) { throw "자가진단 실패 (종료코드 $($p.ExitCode))" }
          $found = (Get-Content $rep -Raw | ConvertFrom-Json).ffmpeg
          if ($found -notmatch "_MEI") {
            throw "번들 안의 ffmpeg 를 쓰지 않았습니다: $found"
          }
          Write-Host "번들 ffmpeg 확인: $found"

      - name: 이름 바꿔 보관
        run: Move-Item dist\GifBox.exe out\GifBox-full.exe

      - name: 크기 확인 · 체크섬 만들기
        run: |
          Get-ChildItem out | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}
          # 받는 쪽이 파일이 온전한지 확인할 수 있도록 함께 올린다
          $lines = Get-ChildItem out -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Set-Content out\SHA256SUMS.txt -Encoding ascii
          Get-Content out\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GifBox
          path: out/*.exe

      # --- 태그를 밀었을 때만 릴리스 -------------------------------------
      - name: 릴리스 만들기
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $changes = python -c "from gifbox import changelog; print(changelog.for_version())"
          $notes = @"
          ## 바뀐 것

          $changes

          ## 받는 법

          | 파일 | 설명 |
          |---|---|
          | **GifBox-full.exe** | 이것만 받으면 됩니다. ffmpeg 포함, 설치 필요 없음 |
          | GifBox.exe | 가벼운 쪽. PC에 ffmpeg 가 이미 있을 때 |

          받아서 두 번 누르면 창이 뜹니다. 파일을 창에 끌어다 놓으면 GIF로 바뀌고
          결과가 바로 클립보드에 올라가니 디스코드에 Ctrl+V 하면 됩니다.

          ### 처음 실행할 때 파란 경고창이 뜬다면

          코드 서명 인증서를 붙이지 않아서 Windows SmartScreen 이 모르는 프로그램이라고
          경고합니다. **추가 정보 → 실행** 을 누르면 됩니다. 백신이 걸고넘어지는 경우도
          있는데 PyInstaller 로 묶은 exe 에서 흔한 오탐입니다.
          "@
          gh release create "$env:GITHUB_REF_NAME" `
            out\GifBox.exe out\GifBox-full.exe out\SHA256SUMS.txt `
            --title "GifBox $env:GITHUB_REF_NAME" `
            --notes $notes
